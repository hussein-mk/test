<script>
document.getElementById("clientForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const submitButton = document.querySelector("button[type='submit']");
    submitButton.disabled = true;
    submitButton.innerText = "جاري الإرسال...";

    const data = {
        "تاريخ الإرسال": new Date().toLocaleString("ar-SA"),
        "اسم العميل": document.getElementById("name").value,
        "رقم الجوال": document.getElementById("phone").value,
        "البريد الالكتروني": document.getElementById("email").value,
        "اسم الشركة": document.getElementById("company").value,
        "الخدمة": document.getElementById("service").value,
        "تاريخ الموعد": document.getElementById("date").value,
        "وقت الموعد": document.getElementById("time").value,
        "ملاحظات": document.getElementById("notes").value
    };

    try {

        const response = await fetch(
            "https://husseinmk.app.n8n.cloud/webhook/7b84117c-6cc7-4b64-b91c-b7ac0405262f",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            }
        );

        if (!response.ok) {
            throw new Error("Webhook Error");
        }

        document.getElementById("successMsg").innerHTML =
            "✅ تم إرسال بياناتك بنجاح وسيتم التواصل معك قريباً";

        document.getElementById("successMsg").style.display = "block";

        document.getElementById("clientForm").reset();

        setTimeout(() => {
            document.getElementById("successMsg").style.display = "none";
        }, 5000);

    } catch (error) {

        alert("❌ حدث خطأ أثناء إرسال البيانات، يرجى المحاولة مرة أخرى");

        console.error(error);

    } finally {

        submitButton.disabled = false;
        submitButton.innerText = "إرسال الطلب";

    }

});
</script>
