<script>

const WEBHOOK_URL =
"https://husseinmk.app.n8n.cloud/webhook/02444acc-60af-4ae9-9d14-46600d438d66";

let count = 0;

document.getElementById("clientForm")
.addEventListener("submit", async function(e){

e.preventDefault();

const btn =
document.querySelector("button[type='submit']");

btn.disabled = true;
btn.innerText = "جاري الإرسال...";

const data = {

submitDate:new Date().toISOString(),

name:document.getElementById("name").value,
phone:document.getElementById("phone").value,
email:document.getElementById("email").value,
company:document.getElementById("company").value,
service:document.getElementById("service").value,
date:document.getElementById("date").value,
time:document.getElementById("time").value,
notes:document.getElementById("notes").value

};

try {

const response = await fetch(
WEBHOOK_URL,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
}
);

if(response.ok){

count++;

document.getElementById("totalAppointments").innerText = count;
document.getElementById("todayAppointments").innerText = count;
document.getElementById("reminders").innerText = count;

const table =
document.getElementById("appointmentsTable");

if(table.innerText.includes("لا توجد مواعيد")){
table.innerHTML="";
}

table.insertAdjacentHTML(
"afterbegin",
`
<tr>
<td style="padding:12px">${data.name}</td>
<td style="padding:12px">${data.service}</td>
<td style="padding:12px">${data.date} ${data.time}</td>
</tr>
`
);

document.getElementById("successMsg").style.display="block";

document.getElementById("clientForm").reset();

setTimeout(()=>{
document.getElementById("successMsg").style.display="none";
},4000);

}else{

alert("فشل إرسال البيانات");

}

}catch(error){

}

btn.disabled = false;

});
